# Atualiza docs/demo.json com produtos REAIS das lojas (fotos, preços, estoque).
# O site usa esse arquivo enquanto o Supabase não estiver configurado.
name: Atualizar vitrine de demonstração

on:
  workflow_dispatch:
  schedule:
    - cron: "30 7 * * 1"   # toda segunda, 04h30 Brasília

permissions:
  contents: write

concurrency:
  group: gerar-demo
  cancel-in-progress: false

jobs:
  demo:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python -m bot.amostra
      - name: Salvar no repositório
        run: |
          git config user.name "voltou-bot"
          git config user.email "voltou-bot@users.noreply.github.com"
          git add docs/demo.json
          git diff --cached --quiet && echo "sem mudanças" && exit 0
          git commit -m "Vitrine de demonstração atualizada (produtos reais)"
          git pull --rebase -q
          git push
