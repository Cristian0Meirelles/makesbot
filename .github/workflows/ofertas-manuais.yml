# Quando você edita config/ofertas_manuais.yaml (ex.: ofertas do TikTok Shop),
# o site é atualizado em ~1 minuto.
name: Publicar ofertas manuais

on:
  push:
    paths:
      - config/ofertas_manuais.yaml
  workflow_dispatch:

concurrency:
  group: manuais
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publicar:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Publicar no site e avisar quem espera
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          SITE_URL: ${{ vars.SITE_URL || 'https://voltou-lilac.vercel.app' }}
        run: |
          python -m bot.main manuais
          python -m bot.main rapido
