name: Catálogo MAC (nuvem)
on:
  push:
    branches: [main]
    paths: [bot/mac_oficial.py, .github/workflows/mac.yml]
  schedule:
    - cron: "20 0,12 * * *"
  workflow_dispatch:

permissions:
  contents: read
concurrency:
  group: catalogo-mac
  cancel-in-progress: false

jobs:
  mac:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-browser.txt
      - name: Importar catálogo oficial por produto e cor
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python -m bot.mac_oficial
      - if: always()
        run: python -m playwright install --with-deps --only-shell chromium
      - name: Atualizar ofertas e vitrine
        if: always()
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          ADMIN_EMAIL: ${{ secrets.ADMIN_EMAIL }}
          SMTP_HOST: ${{ vars.SMTP_HOST }}
          SMTP_PORT: ${{ vars.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
        run: python -m bot.main navegador --loja "MAC Cosmetics"
