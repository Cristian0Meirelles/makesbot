name: Variantes prioritárias
on:
  push:
    branches: [main]
    paths: [bot/prioritarios.py, .github/workflows/prioritarios.yml]
  schedule:
    - cron: "35 8 * * *"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: variantes-prioritarias
  cancel-in-progress: false
jobs:
  atualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m bot.prioritarios
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
