#    shopify      -> loja Shopify
#    mercadolivre -> busca do Mercado Livre
#  marcas:  se a loja for da própria marca, coloque o nome da marca aqui
#           (aí o título do produto não precisa repetir a marca)
#  afiliado: modelo do link de afiliado. Use {url} ou {url_enc}.
#     Awin:   https://www.awin1.com/cread.php?awinmid=ID_LOJA&awinaffid=SEU_ID&ued={url_enc}
#     Amazon: {url}?tag=SEU-TAG-20
