# =====================================================================
#  Catálogo do TikTok Shop (todas as lojas/vendedores de maquiagem)
# ---------------------------------------------------------------------
#  Roda 2x por dia junto com a Action "TikTok Shop". O bot abre cada
#  categoria abaixo, clica em "Ver mais" até acabar e guarda os produtos.
#  Cada categoria mostra no máximo ~100 produtos por vez no site.
#  categoria: categoria do site (vazio = descobre pelo nome do produto)
# =====================================================================
hosts_links:
  - www.zattini.com.br
  - www.mercadolivre.com.br
  - mercadolivre.com.br
  - produto.mercadolivre.com.br
  - www.tiktok.com
  - shop.tiktok.com
  - vm.tiktok.com
  - vt.tiktok.com
  - www.amazon.com.br
  - amazon.com.br

tiktok_catalogo:
  max_cliques_ver_mais: 15
  espera_entre_cliques_seg: 2.0
  detalhar_max: 40          # produtos sem marca reconhecida que ele abre pra ler a marca
  esperar_verificacao_min: 10   # no robô do PC: quanto tempo espera você resolver o quebra-cabeça do TikTok
  tentativas: 2                 # se falhar, tenta de novo...
  espera_entre_tentativas_min: 10   # ...depois de X minutos
  minimo_produtos: 100          # abaixo disso manda aviso pro ADMIN_EMAIL (precisa de nova versão do bot?)
  marcas_extra: []          # marcas que ele ainda não reconhece pelo nome, ex.: [Minha Marca]
  categorias:
    lipstick-lip-gloss/601534: Batom
    eyeliner-lipliner/601587: Delineador
    eyebrow-products/601586: Sobrancelha
    eyeshadow/601588: Sombra
    concealer-foundation/601554: Base
    mascara/601585: Máscara de cílios
    powder/601558: Pó
    blush/601560: Blush
    bb-cc-creams/601550: Base
    bronzer-highlighter/601555: Iluminador
    makeup-base-and-primers/601556: Primer
    makeup-fixing-spray/601552: Fixador
    makeup-sets/601529:
    makeup/848648:

# =====================================================================
#  Lojas lidas pelo navegador (robô do PC, abre o Google Chrome)
# ---------------------------------------------------------------------
#  Para lojas que bloqueiam o bot do GitHub. O robô entra no site como
#  uma pessoa, passa pelas categorias de maquiagem, abre cada produto e lê
#  nome, cor, preço, foto, estoque e link. Só lê: não compra, não clica em
#  nada além de "carregar mais", não faz login.
#  Roda junto com robo-tiktok\rodar.bat (09h e 21h).
#
#  nome / marca / dominio
#  inicio            página por onde começa
#  categorias        páginas de categoria (além das que ele achar sozinho)
#  padrao_categoria  regex do link de categoria de maquiagem
#  padrao_produto    regex do link de produto
#  max_produtos      limite por rodada
#  minimo_ofertas    abaixo disso manda aviso pro ADMIN_EMAIL
# =====================================================================
lojas_navegador:
  esperar_verificacao_min: 10
  lojas:
    - nome: MAC Cosmetics
      marca: MAC
      dominio: www.maccosmetics.com.br
      inicio: https://www.maccosmetics.com.br/products/13831/produtos/maquiagem/labios
      categorias:
        - https://www.maccosmetics.com.br/products/13831/produtos/maquiagem/labios
        - https://www.maccosmetics.com.br/products/13830/produtos/maquiagem/rosto
      padrao_categoria: '/products/\d+/produtos/maquiagem/'
      padrao_produto: '/product/\d+/\d+/'
      max_produtos: 800
      minimo_ofertas: 100
      pausa_seg: [1.5, 3.5]
